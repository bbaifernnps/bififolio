<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AEDAR — Log in</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="../components/aedar-ui.css" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-sans); color: var(--colors-light-foreground); background: var(--colors-light-background); -webkit-font-smoothing: antialiased; }
  .auth { min-height: 100vh; display: flex; }
  .auth-left { position: relative; flex: 1 1 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 32px; overflow: hidden; }
  .auth-left::before {
    content: ""; position: absolute; top: -180px; left: 50%; transform: translateX(-50%); width: 760px; height: 760px; pointer-events: none;
    background-image: radial-gradient(circle, rgba(14,110,183,0.16) 1px, transparent 1.4px);
    background-size: 26px 26px;
    -webkit-mask-image: radial-gradient(circle at center, #000 0%, transparent 62%);
    mask-image: radial-gradient(circle at center, #000 0%, transparent 62%);
    opacity: .8;
  }
  .auth-right { flex: 1 1 50%; background: url("assets/login-hero.png") center / cover no-repeat; }
  .auth-form { position: relative; width: 360px; max-width: 100%; display: flex; flex-direction: column; align-items: center; gap: 32px; }
  .auth-logo { height: 40px; }
  .auth-head { text-align: center; display: flex; flex-direction: column; gap: 10px; }
  .auth-title { font-size: 30px; font-weight: 600; line-height: 38px; letter-spacing: -0.01em; color: rgb(16,24,40); }
  .auth-sub { font-size: 16px; font-weight: 400; line-height: 24px; color: rgb(71,84,103); }
  .auth-fields { width: 100%; display: flex; flex-direction: column; gap: 20px; }
  .pw-row { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  .pw-row .field { width: 100%; }
  .auth-actions { width: 100%; display: flex; flex-direction: column; gap: 16px; }
  .auth-row { display: flex; gap: 4px; justify-content: center; align-items: baseline; font-size: 14px; color: rgb(71,84,103); }
  .auth-foot { position: absolute; bottom: 24px; left: 32px; font-size: 14px; color: rgb(71,84,103); }
  .btn-full { width: 100%; }
  .link-btn { background: none; border: none; padding: 0; font-family: var(--font-sans); font-weight: 500; font-size: 14px; color: var(--colors-light-primary); cursor: pointer; }
  .link-btn.sm { font-size: 14px; }
  .link-btn:hover { text-decoration: underline; }
  [data-view] { display: none; }
  [data-view].active { display: flex; flex-direction: column; align-items: center; gap: 32px; }
  .success-check { width: 72px; height: 72px; border-radius: 9999px; background: var(--status-operational-soft); display: flex; align-items: center; justify-content: center; }
  .success-check svg { width: 34px; height: 34px; color: var(--status-operational); }
  /* Full-page (no hero) mode for reset flow */
  .auth.full .auth-right { display: none; }
  .auth.full .auth-left { justify-content: flex-start; padding-top: 11vh; }
  .auth-form.reset { width: 440px; }
  .reset-card { width: 100%; border: 1px solid var(--colors-light-border); border-radius: 12px; background: var(--colors-light-background); box-shadow: 0 1px 3px rgba(0,0,0,.1), 0 2px 4px -1px rgba(0,0,0,.1); padding: 24px 8px 16px; display: flex; flex-direction: column; gap: 16px; }
  .reset-card .field { padding: 0 8px; }
  .reset-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 0 8px; }
  @media (max-width: 900px) { .auth-right { display: none; } }
</style>
</head>
<body>
<div class="auth">
  <div class="auth-left">
    <!-- Login -->
    <div class="auth-form" data-view="login">
      <img class="auth-logo" src="../components/assets/healix-wordmark.svg" alt="Healix" />
      <div class="auth-head"><span class="auth-title">Log in to your account</span></div>
      <div class="auth-fields">
        <div class="field"><label class="field-label" for="email">Email</label><input class="input" id="email" type="email" placeholder="you@hospital.co.th" /></div>
        <div class="pw-row">
          <div class="field"><label class="field-label" for="pw">Password</label><input class="input" id="pw" type="password" placeholder="••••••••" /></div>
          <button class="link-btn sm" type="button" data-goto="forgot">Forgot password</button>
        </div>
      </div>
      <div class="auth-actions">
        <button class="btn btn-default btn-full" onclick="location.href='Dashboard.html'">Sign in</button>
      </div>
    </div>

    <!-- Forgot password (full page) -->
    <div class="auth-form reset" data-view="forgot">
      <img class="auth-logo" src="../components/assets/healix-wordmark.svg" alt="Healix" />
      <div class="auth-head">
        <span class="auth-title">Reset your password</span>
        <span class="auth-sub">Enter your email to receive a reset link.</span>
      </div>
      <div class="reset-card">
        <div class="field"><label class="field-label" for="remail">Email</label><input class="input" id="remail" type="email" placeholder="example@gmail.com" /></div>
        <div class="reset-foot">
          <button class="btn btn-outline" data-goto="login">Back</button>
          <button class="btn btn-default" id="send-reset">Send reset link</button>
        </div>
      </div>
    </div>

    <span class="auth-foot">© MediGrowth</span>
  </div>
  <div class="auth-right"></div>
</div>

<script src="../components/toast.js" defer></script>
<script>
  const auth = document.querySelector('.auth');
  const views = document.querySelectorAll('[data-view]');
  function go(name) {
    views.forEach((v) => v.classList.toggle('active', v.dataset.view === name));
    auth.classList.toggle('full', name !== 'login');
  }
  document.querySelectorAll('[data-goto]').forEach((b) => b.addEventListener('click', () => go(b.dataset.goto)));

  // Send reset link -> toast + resend countdown
  let timer = null;
  function sendReset() {
    const email = (document.getElementById('remail').value || 'example@gmail.com').trim();
    if (window.AEDARToast) AEDARToast.show({ variant: 'info', title: 'Check your email', description: "We've sent a password reset link to: " + email, duration: 6000 });
    const btn = document.getElementById('send-reset');
    let n = 30; btn.disabled = true;
    const tick = () => { btn.textContent = 'Resend in ' + n + ' s.'; if (n-- <= 0) { clearInterval(timer); btn.disabled = false; btn.textContent = 'Resend link'; } };
    tick(); clearInterval(timer); timer = setInterval(tick, 1000);
  }
  document.getElementById('send-reset').addEventListener('click', sendReset);
  go('login');
</script>
</body>
</html>
